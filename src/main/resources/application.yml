spring:
  application:
    name: BoOmm Backend
  datasource:
    url: jdbc:mysql://dev.macacolabs.site:10001/boomm
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: mysql@
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect    # 이 부분 주의!
    properties:
      hibernate:
        show-sql: true
        format-sql: true
        use_sql_comments: true
    hibernate:
      ddl-auto: update

logging:
  level:
    org.hibernate.orm.jdbc.bind: trace

  # 2. OAuth2 설정 (네이버)
  security:
    oauth2:
      client:
        registration:
          naver:
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: http://localhost:8080/login/oauth2/code/naver
            scope:
              - name
              - email
            client-name: Naver

# JWT 설정 (커스텀 값)
jwt:
  # [필수] Base64 인코딩된 임의의 긴 문자열 (32자 이상 권장)
  secret: c3ByaW5nLWJvb3Qtc2VjdXJpdHktYm9vbW0tdGVzdC1qd3Qtc2VjcmV0LWtleS12YWx1ZQ==
  access-token-validity-in-seconds: 1800  # 30분
  refresh-token-validity-in-seconds: 1209600 # 14일

